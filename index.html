<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GLOBIRA | Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f3ee;
    color:#111;
}

/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:45px 35px;
    border:1px solid #ddd;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-family:Georgia, serif;
    font-size:34px;
    letter-spacing:8px;
    margin-bottom:10px;
}

.login-subtitle{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:35px;
}

.login-box input{
    width:100%;
    height:52px;
    padding:0 15px;
    border:1px solid #ccc;
    outline:none;
    font-size:15px;
    margin-bottom:15px;
}

.login-box input:focus{
    border-color:#111;
}

.login-box button{
    width:100%;
    height:52px;
    border:0;
    background:#111;
    color:#fff;
    cursor:pointer;
    font-size:14px;
    letter-spacing:1px;
}

.login-box button:hover{
    background:#333;
}

.login-message{
    min-height:20px;
    text-align:center;
    color:#c00;
    font-size:13px;
    margin-top:15px;
}

/* =====================================================
   DASHBOARD
===================================================== */

#dashboard{
    display:none;
    min-height:100vh;
}

.header{
    height:75px;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.header-logo{
    font-family:Georgia, serif;
    font-size:24px;
    letter-spacing:5px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.header-right span{
    font-size:13px;
    color:#ccc;
}

.logout-btn{
    background:#fff;
    color:#111;
    border:0;
    padding:10px 18px;
    cursor:pointer;
}

.logout-btn:hover{
    background:#ddd;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    padding:30px;
    max-width:1500px;
    margin:auto;
}

.page-title{
    margin:0 0 25px;
    font-family:Georgia, serif;
    font-size:32px;
}

/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;
    grid-template-columns:
        repeat(4, minmax(0,1fr));
    gap:15px;
    margin-bottom:30px;
}

.stat{
    background:#fff;
    border:1px solid #ddd;
    padding:22px;
}

.stat-label{
    color:#777;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-value{
    font-size:28px;
    margin-top:10px;
}

/* =====================================================
   ORDERS
===================================================== */

.orders-container{
    background:#fff;
    border:1px solid #ddd;
}

.orders-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px;
    border-bottom:1px solid #ddd;
}

.orders-header h2{
    margin:0;
    font-size:20px;
}

.refresh-btn{
    border:1px solid #111;
    background:#fff;
    padding:10px 16px;
    cursor:pointer;
}

.refresh-btn:hover{
    background:#111;
    color:#fff;
}

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
}

/* =====================================================
   ORDER CARD
===================================================== */

.order{
    border-bottom:1px solid #ddd;
    padding:25px;
}

.order:last-child{
    border-bottom:0;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}

.order-number{
    font-weight:bold;
    font-size:17px;
}

.order-date{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.order-total{
    font-size:20px;
    font-weight:bold;
}

.order-grid{
    display:grid;
    grid-template-columns:
        repeat(3,minmax(0,1fr));
    gap:20px;
    margin-bottom:20px;
}

.info-box{
    background:#f7f6f2;
    padding:15px;
}

.info-title{
    color:#777;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:10px;
    margin-bottom:8px;
}

.info-value{
    font-size:14px;
    line-height:1.6;
    word-break:break-word;
}

/* =====================================================
   BADGES
===================================================== */

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.badge{
    padding:7px 10px;
    font-size:11px;
    border:1px solid #ccc;
    background:#f7f7f7;
}

.badge.paid{
    background:#e8f5e9;
    border-color:#b7d9bb;
}

.badge.pending{
    background:#fff8df;
    border-color:#eadb9c;
}

.badge.processing{
    background:#e8f0ff;
    border-color:#b7c8ec;
}

.badge.cancelled{
    background:#ffe8e8;
    border-color:#e3b0b0;
}

/* =====================================================
   ACTIONS
===================================================== */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.action-btn{
    padding:11px 16px;
    border:1px solid #111;
    background:#111;
    color:#fff;
    cursor:pointer;
    font-size:12px;
}

.action-btn:hover{
    opacity:.85;
}

.action-btn.secondary{
    background:#fff;
    color:#111;
}

.action-btn.danger{
    background:#fff;
    color:#b00000;
    border-color:#b00000;
}

.action-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* =====================================================
   NOTES
===================================================== */

.notes{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.note{
    font-size:12px;
    color:#666;
    margin-bottom:7px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .stats{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .order-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .header{
        padding:0 15px;
    }

    .header-logo{
        font-size:18px;
    }

    .header-right span{
        display:none;
    }

    .main{
        padding:15px;
    }

    .page-title{
        font-size:26px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .order{
        padding:18px;
    }

    .order-top{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

    <div class="login-box">

        <div class="logo">
            GLOBIRA
        </div>

        <div class="login-subtitle">
            ADMINISTRATION PANEL
        </div>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter admin password"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            LOGIN
        </button>

        <div
            id="loginMessage"
            class="login-message"
        ></div>

    </div>

</section>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<section id="dashboard">

    <header class="header">

        <div class="header-logo">
            GLOBIRA
        </div>

        <div class="header-right">

            <span>
                ADMIN PANEL
            </span>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                LOGOUT
            </button>

        </div>

    </header>


    <main class="main">

        <h1 class="page-title">
            Orders
        </h1>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    Total Orders
                </div>

                <div
                    class="stat-value"
                    id="totalOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Payment Pending
                </div>

                <div
                    class="stat-value"
                    id="pendingPayments"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Paid
                </div>

                <div
                    class="stat-value"
                    id="paidOrders"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Processing
                </div>

                <div
                    class="stat-value"
                    id="processingOrders"
                >
                    0
                </div>

            </div>

        </div>


        <!-- ORDERS -->

        <div class="orders-container">

            <div class="orders-header">

                <h2>
                    Customer Orders
                </h2>

                <button
                    class="refresh-btn"
                    id="refreshBtn"
                >
                    REFRESH
                </button>

            </div>

            <div id="ordersList">

                <div class="loading">
                    Loading orders...
                </div>

            </div>

        </div>

    </main>

</section>


<script>

/* =====================================================
   API CONNECTION
===================================================== */

const API_BASE = "https://globira.vercel.app";

function apiUrl(path){
    return API_BASE + path;
}

async function apiFetch(path, options = {}){
    const finalOptions = {
        ...options,
        credentials:"include",
        headers:{
            ...(options.headers || {})
        }
    };

    return fetch(apiUrl(path), finalOptions);
}

async function readApiResponse(response){
    const text = await response.text();

    try{
        return text ? JSON.parse(text) : {};
    }catch{
        throw new Error(
            `Server returned an invalid response (${response.status}).`
        );
    }
}


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
    document.getElementById("loginScreen");

const dashboard =
    document.getElementById("dashboard");

const adminPassword =
    document.getElementById("adminPassword");

const loginBtn =
    document.getElementById("loginBtn");

const loginMessage =
    document.getElementById("loginMessage");

const logoutBtn =
    document.getElementById("logoutBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const ordersList =
    document.getElementById("ordersList");


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatMoney(amount,currency){

    const number =
        Number(amount || 0);

    return `${currency || "INR"} ${number.toLocaleString()}`;
}


function formatDate(date){

    if(!date){
        return "-";
    }

    try{

        return new Date(date)
            .toLocaleString();

    }catch{

        return date;
    }
}


function showLogin(){

    loginScreen.style.display =
        "flex";

    dashboard.style.display =
        "none";
}


function showDashboard(){

    loginScreen.style.display =
        "none";

    dashboard.style.display =
        "block";
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const password =
        adminPassword.value.trim();

    loginMessage.textContent = "";

    if(!password){

        loginMessage.textContent =
            "Please enter your password.";

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "LOGINNING...";

    try{

        const response =
            await apiFetch(
                "/api/admin/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    credentials:"include",

                    body:JSON.stringify({
                        password
                    })
                }
            );

        const data =
            await readApiResponse(response);

        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Login failed"
            );
        }

        adminPassword.value = "";

        showDashboard();

        await loadOrders();

    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        loginMessage.textContent =
            error.message ||
            "Login failed.";

    }finally{

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";
    }
}


/* =====================================================
   SESSION CHECK
===================================================== */

async function checkSession(){

    try{

        const response =
            await apiFetch(
                "/api/admin/session",
                {
                    credentials:"include"
                }
            );

        const data =
            await readApiResponse(response);

        if(data.loggedIn){

            showDashboard();

            await loadOrders();

        }else{

            showLogin();
        }

    }catch(error){

        console.error(
            "SESSION ERROR:",
            error
        );

        showLogin();
    }
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        await apiFetch(
            "/api/admin/logout",
            {
                method:"POST",
                credentials:"include"
            }
        );

    }catch(error){

        console.error(error);

    }

    showLogin();

    loginMessage.textContent = "";

    ordersList.innerHTML = `
        <div class="loading">
            Please login to view orders.
        </div>
    `;
}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    ordersList.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;

    try{

        const response =
            await apiFetch(
                "/api/admin/orders",
                {
                    credentials:"include"
                }
            );

        const data =
            await readApiResponse(response);

        if(response.status === 401){

            showLogin();

            return;
        }

        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Could not load orders"
            );
        }

        const orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];

        updateStats(orders);

        renderOrders(orders);

    }catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );

        ordersList.innerHTML = `
            <div class="empty">
                Could not load orders.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


/* =====================================================
   STATS
===================================================== */

function updateStats(orders){

    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;

    document.getElementById(
        "pendingPayments"
    ).textContent =
        orders.filter(
            order =>
                order.paymentStatus ===
                "PENDING"
        ).length;

    document.getElementById(
        "paidOrders"
    ).textContent =
        orders.filter(
            order =>
                order.paymentStatus ===
                "CONFIRMED"
        ).length;

    document.getElementById(
        "processingOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status ===
                "PROCESSING"
        ).length;
}


/* =====================================================
   STATUS BADGE
===================================================== */

function badgeClass(value){

    const text =
        String(value || "")
            .toLowerCase();

    if(
        text.includes("confirmed") ||
        text.includes("paid")
    ){
        return "paid";
    }

    if(
        text.includes("pending")
    ){
        return "pending";
    }

    if(
        text.includes("processing")
    ){
        return "processing";
    }

    if(
        text.includes("cancel")
    ){
        return "cancelled";
    }

    return "";
}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders){

    if(!orders.length){

        ordersList.innerHTML = `
            <div class="empty">
                No customer orders yet.
            </div>
        `;

        return;
    }

    ordersList.innerHTML =
        orders.map(renderOrder).join("");
}


/* =====================================================
   RENDER SINGLE ORDER
===================================================== */

function renderOrder(order){

    const customer =
        order.customer || {};

    const address =
        order.shippingAddress || {};

    const items =
        Array.isArray(order.items)
            ? order.items
            : [];

    const notes =
        Array.isArray(order.notes)
            ? order.notes
            : [];

    const addressText = [
        address.name,
        address.address,
        address.address1,
        address.address2,
        address.city,
        address.state,
        address.postcode,
        address.zip,
        address.country
    ]
    .filter(Boolean)
    .join(", ");

    const itemText =
        items.length
            ? items.map(item => {

                const name =
                    item.title ||
                    item.name ||
                    "Product";

                const quantity =
                    item.quantity ||
                    1;

                return `${name} × ${quantity}`;

            }).join("<br>")
            : "No item information";


    const canConfirm =
        order.paymentStatus !==
        "CONFIRMED";

    const canSendCJ =
        order.paymentStatus ===
        "CONFIRMED" &&
        order.status !==
        "CANCELLED";


    return `

        <article
            class="order"
            data-order-id="${escapeHtml(order.id)}"
        >

            <div class="order-top">

                <div>

                    <div class="order-number">
                        ${escapeHtml(
                            order.orderNumber ||
                            order.id
                        )}
                    </div>

                    <div class="order-date">
                        ${escapeHtml(
                            formatDate(
                                order.createdAt
                            )
                        )}
                    </div>

                </div>

                <div class="order-total">
                    ${escapeHtml(
                        formatMoney(
                            order.total,
                            order.currency
                        )
                    )}
                </div>

            </div>


            <div class="badges">

                <span class="badge ${badgeClass(
                    order.status
                )}">
                    ORDER:
                    ${escapeHtml(
                        order.status ||
                        "UNKNOWN"
                    )}
                </span>

                <span class="badge ${badgeClass(
                    order.paymentStatus
                )}">
                    CUSTOMER PAYMENT:
                    ${escapeHtml(
                        order.paymentStatus ||
                        "UNKNOWN"
                    )}
                </span>

                <span class="badge">
                    CJ PAYMENT:
                    ${escapeHtml(
                        order.cjPaymentStatus ||
                        "NOT CREATED"
                    )}
                </span>

                ${
                    order.cjStatus
                    ? `
                        <span class="badge">
                            CJ STATUS:
                            ${escapeHtml(
                                order.cjStatus
                            )}
                        </span>
                    `
                    : ""
                }

            </div>


            <div class="order-grid">

                <div class="info-box">

                    <div class="info-title">
                        Customer
                    </div>

                    <div class="info-value">

                        <strong>
                            ${escapeHtml(
                                customer.name ||
                                "No name"
                            )}
                        </strong>

                        <br>

                        ${escapeHtml(
                            customer.email ||
                            "No email"
                        )}

                        <br>

                        ${escapeHtml(
                            customer.phone ||
                            "No phone"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-title">
                        Shipping Address
                    </div>

                    <div class="info-value">
                        ${escapeHtml(
                            addressText ||
                            "No address"
                        )}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-title">
                        Products
                    </div>

                    <div class="info-value">
                        ${itemText}
                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="action-btn"
                    data-action="confirm-payment"
                    data-id="${escapeHtml(order.id)}"
                    ${canConfirm ? "" : "disabled"}
                >
                    CONFIRM CUSTOMER PAYMENT
                </button>


                <button
                    class="action-btn secondary"
                    data-action="send-cj"
                    data-id="${escapeHtml(order.id)}"
                    ${canSendCJ ? "" : "disabled"}
                >
                    CREATE CJ ORDER
                </button>


                <button
                    class="action-btn secondary"
                    data-action="sync-cj"
                    data-id="${escapeHtml(order.id)}"
                >
                    SYNC CJ
                </button>


                <button
                    class="action-btn danger"
                    data-action="cancel"
                    data-id="${escapeHtml(order.id)}"
                    ${
                        order.status === "CANCELLED"
                        ? "disabled"
                        : ""
                    }
                >
                    CANCEL ORDER
                </button>

            </div>


            ${
                notes.length
                ? `
                    <div class="notes">

                        ${notes.map(note => `
                            <div class="note">
                                ${escapeHtml(
                                    formatDate(
                                        note.time
                                    )
                                )}
                                —
                                ${escapeHtml(
                                    note.message
                                )}
                            </div>
                        `).join("")}

                    </div>
                `
                : ""
            }

        </article>
    `;
}


/* =====================================================
   ACTIONS
===================================================== */

async function performAction(
    action,
    id
){

    let endpoint = "";
    let message = "";

    if(action === "confirm-payment"){

        endpoint =
            `/api/admin/orders/${encodeURIComponent(id)}/confirm-payment`;

        message =
            "Customer payment has been confirmed.";

    }

    else if(action === "send-cj"){

        endpoint =
            `/api/admin/orders/${encodeURIComponent(id)}/send-to-cj`;

        message =
            "Order prepared for CJ. GLOBIRA did not pay CJ.";

    }

    else if(action === "sync-cj"){

        endpoint =
            `/api/admin/orders/${encodeURIComponent(id)}/sync-cj`;

        message =
            "CJ sync completed.";

    }

    else if(action === "cancel"){

        const confirmed =
            window.confirm(
                "Are you sure you want to cancel this order?"
            );

        if(!confirmed){
            return;
        }

        endpoint =
            `/api/admin/orders/${encodeURIComponent(id)}/cancel`;

        message =
            "Order cancelled.";

    }

    else{

        return;
    }


    try{

        const response =
            await apiFetch(
                endpoint,
                {
                    method:"POST",
                    credentials:"include",

                    headers:{
                        "Content-Type":
                            "application/json"
                    }
                }
            );

        const data =
            await readApiResponse(response);

        if(response.status === 401){

            showLogin();

            return;
        }

        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Action failed"
            );
        }

        alert(
            data.message ||
            message
        );

        await loadOrders();

    }catch(error){

        console.error(
            "ACTION ERROR:",
            error
        );

        alert(
            error.message ||
            "Action failed"
        );
    }
}


/* =====================================================
   BUTTON EVENTS
===================================================== */

loginBtn.addEventListener(
    "click",
    login
);

adminPassword.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            login();
        }
    }
);


logoutBtn.addEventListener(
    "click",
    logout
);


refreshBtn.addEventListener(
    "click",
    loadOrders
);


/* =====================================================
   ORDER ACTION EVENT DELEGATION
===================================================== */

ordersList.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                "[data-action]"
            );

        if(!button){
            return;
        }

        const action =
            button.dataset.action;

        const id =
            button.dataset.id;

        if(!id){
            return;
        }

        performAction(
            action,
            id
        );
    }
);


/* =====================================================
   START
===================================================== */

checkSession();

</script>

</body>
</html>
